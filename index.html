<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Tarea Virtual 1</title>
</head>
<body class="bg-gray-900 h-full py-12 flex justify-center items-center">
    <div class="flex flex-col items-center justify-center xl:w-2/6 lg:w-2/5 md:w-2/5 sm:w-11/12">
        <h1 class="text-3xl leading-tight font-bold text-center text-gray-200">Iniciar sesión</h1>
        <div class="mt-4 text-center w-9/12 text-gray-400">
            Ingrese su usuario y contraseña para iniciar sesión.
        </div>
        <form action="" id="login_form" class="mt-3 w-9/12">
            <div>
                <label for="username" class="block mb-2 text-sm font-medium text-gray-300">Usuario:</label>
                <input type="text" id="username" class="mb-1 border text-sm rounded-lg w-full p-2.5 bg-gray-700 border-gray-600 placeholder-gray-400 text-white" placeholder="Ingrese su nombre de usuario" required>
                <span id="validation_username" class="text-red-500 text-sm hidden">El campo usuario debe contener mínimo 6 caracteres</span>
            </div>
            <div>
                <label for="password" class="block mt-3 mb-2 text-sm font-medium text-gray-300">Contraseña:</label>
                <input type="password" id="password" class="mb-1 border text-sm rounded-lg w-full p-2.5 bg-gray-700 border-gray-600 placeholder-gray-400 text-white" placeholder="Ingrese su contraseña" required>
                <span id="validation_password" class="text-red-500 text-sm hidden">El campo contraseña debe contener mínimo 8 caracteres</span>
            </div>   
            <button type="submit" class="py-2 mt-6 w-full px-4 text-sm font-medium text-center bg-blue-700 text-white rounded-lg bg-primary-700">Iniciar sesión</button>
        </form>
    </div>
    <script type="application/javascript" src="script.js"></script>
</body>
</html>
