<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tarea Virtual 1</title>
</head>
<body class="bg-gray-900 h-full py-12 flex justify-center items-center">
    <div class="flex flex-col items-center justify-center xl:w-2/4 lg:w-3/4 md:w-9/12 sm:w-11/12">
        <h1 class="text-3xl leading-tight font-bold text-center text-gray-200">Formulario de registro</h1>
        <div class="mt-4 text-center w-9/12 text-gray-400">
            Escribe tus datos de usuario en el siguiente formulario y por último aprieta el botón enviar
        </div>
        <form action="#" class="mt-3 w-9/12">
            <div>
                <label for="username" class="block mb-2 text-sm font-medium text-gray-300">Usuario:</label>
                <input type="text" id="username" class="border text-sm rounded-lg w-full p-2.5 bg-gray-700 border-gray-600 placeholder-gray-400 text-white" placeholder="Ingrese su nombre de usuario" required>
            </div>
            <div>
                <label for="password" class="block mt-4 mb-2 text-sm font-medium text-gray-300">Contraseña:</label>
                <input type="password" id="password" class="border text-sm rounded-lg w-full p-2.5 bg-gray-700 border-gray-600 placeholder-gray-400 text-white" placeholder="Ingrese su contraseña" required>
            </div>
            <div>
                <label for="fullname" class="block mt-4 mb-2 text-sm font-medium text-gray-300">Nombre completo:</label>
                <input type="text" id="fullname" class="border text-sm rounded-lg w-full p-2.5 bg-gray-700 border-gray-600 placeholder-gray-400 text-white" placeholder="Ingrese sus nombres y apellidos" required>
            </div>
            <div>
                <label for="address" class="block mt-4 mb-2 text-sm font-medium text-gray-300">Dirección:</label>
                <input type="text" id="address" class="border text-sm rounded-lg w-full p-2.5 bg-gray-700 border-gray-600 placeholder-gray-400 text-white" placeholder="Ingrese su dirección" required>
            </div>
            <div>
                <label for="city" class="block mt-4 mb-2 text-sm font-medium text-gray-300">Ciudad:</label>
                <select name="city" id="city" class="border text-sm rounded-lg w-full p-2.5 bg-gray-700 border-gray-600 placeholder-gray-400 text-white" required aria-placeholder="Seleccione su ciudad">
                    <option value="" disabled selected>Seleccione su ciudad</option>
                    <option value="guayaquil">Guayaquil</option>
                    <option value="quito">Quito</option>
                    <option value="cuenca">Cuenca</option>
                    <option value="machala">Machala</option>
                    <option value="manta">Manta</option>
                    <option value="loja">Loja</option>
                </select>
            </div>
            <div class="block mt-4 mb-2">
                <fieldset>
                    <legend class="block mt-4 mb-2 text-sm font-medium text-gray-300">Tipo de cliente:</legend>
                    <div>
                        <input type="radio" id="customer_profesional" name="customer_type" value="profesional" class="border text-sm rounded-lg p-2.5" required>
                        <label for="customer_profesional" class="mt-4 mb-2 text-sm font-medium text-gray-300">Profesional</label>
                        
                        <input type="radio" id="customer_particular" name="customer_type" value="particular" class="border text-sm rounded-lg p-2.5" required>
                        <label for="customer_particular" class="mt-4 mb-2 text-sm font-medium text-gray-300">Particular</label>
                    </div>
                </fieldset>
            </div>
            <div>
                <label for="comments" class="block mt-4 mb-2 text-sm font-medium text-gray-300">Comentarios:</label>
                <textarea id="comments" class="border text-sm rounded-lg w-full p-2.5 bg-gray-700 border-gray-600 placeholder-gray-400 text-white" placeholder="Ingrese su comentario" required></textarea>
            </div>
            <button type="#" class="mt-2 py-2 px-4 text-sm font-medium text-center bg-blue-700 text-white rounded-lg bg-primary-700">Send message</button>
        </form>
    </div>

</body>
</html>
